name: Local workspace checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_API_KEY: ''
      RESEARCH_DATA_DIR: ${{ github.workspace }}/.ci-data/application
      MPLCONFIGDIR: ${{ github.workspace }}/.ci-data/matplotlib
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Backend tests including backup round trips
        run: .venv/bin/python -m pytest tests backend/test_*.py -q --junitxml=test-results/backend.xml
      - name: Frontend component tests
        working-directory: frontend
        run: npm test
      - name: Concurrent import and retrieval stress
        run: .venv/bin/python scripts/stress_import.py --papers 60 --pages 4 --concurrency 4 --output test-results/import-stress.json
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Three browser engines and isolated backend regression
        working-directory: frontend
        env:
          E2E_BROWSERS: chromium,firefox,webkit
        run: npm run test:e2e
      - name: Mixed real HTTP workload smoke
        run: .venv/bin/python scripts/stress_runtime.py --seconds 60 --output test-results/runtime-soak-ci.json
      - name: Preserve test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: application-checks
          path: |
            test-results/
            frontend/test-results/e2e/
          if-no-files-found: warn
          retention-days: 14

  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LLM_API_KEY: ''
      RESEARCH_DATA_DIR: ${{ github.workspace }}/.ci-data/corpus
      MPLCONFIGDIR: ${{ github.workspace }}/.ci-data/matplotlib
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install parsing dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
      - name: Original PDF acceptance set
        run: .venv/bin/python scripts/evaluate_retrieval.py --output test-results/retrieval.json
      - name: Complete scanned paper and OCR layout regressions
        env:
          RUN_OCR_TESTS: '1'
        run: .venv/bin/python -m pytest backend/test_documents.py::test_real_scanned_paper_all_pages tests/test_ocr_integration.py -q --junitxml=test-results/ocr.xml
      - name: Expanded PDF development regression (all 22 cases required)
        if: ${{ !cancelled() }}
        run: .venv/bin/python scripts/evaluate_retrieval.py --fixture tests/fixtures/retrieval_holdout.json --output test-results/retrieval-holdout.json
      - name: Known 17-case regression with explicit table-cell scoring
        if: ${{ !cancelled() }}
        run: .venv/bin/python scripts/evaluate_retrieval.py --fixture tests/fixtures/retrieval_unseen_v2.json --match-protocol table_cells_v2 --output test-results/retrieval-known17.json
      - name: Known 12-case regression including composite questions and dataset versions
        if: ${{ !cancelled() }}
        run: .venv/bin/python scripts/evaluate_retrieval.py --fixture tests/fixtures/retrieval_unseen_v3.json --match-protocol table_cells_v2 --output test-results/retrieval-known12.json
      - name: Preserve corpus reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: corpus-evaluation
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
